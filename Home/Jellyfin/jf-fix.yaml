apiVersion: v1
kind: Pod
metadata:
  name: jf-fix
  namespace: jellyfin
spec:
  restartPolicy: Never
  containers:
    - name: jf-fix
      image: alpine:latest
      command:
        - sh
        - -c
        - |
          apk add --no-cache sqlite
          DB=$(find /config -name jellyfin.db | head -n1)
          echo "Found DB: $DB"
          sqlite3 "$DB" "UPDATE Users SET InvalidLoginAttemptCount = 0, Password = NULL WHERE Username = 'hennie';"
          sqlite3 "$DB" "UPDATE Permissions SET Value = 0 WHERE Kind = 2 AND UserId IN (SELECT Id FROM Users WHERE Username = 'hennie');"
          echo "Done!"
      volumeMounts:
        - name: cfg
          mountPath: /config
  volumes:
    - name: cfg
      persistentVolumeClaim:
        claimName: jellyfin-media-pvc
